<!DOCTYPE html>
<html>

<body bgcolor="#1C403C">
    <h2 align="center">
        <font color="BFB1A8" face="arial">Login</font>
    </h2>
    <font face="arial">
        <table align="center" bgcolor="#658C88" cellspacing="40" cellpadding="10">
            <tr>
                <td colspan="2" bgcolor="#BFB1A8">
                    <form>
                        <p>Usuário:</p>
                        <input name="user" type="text" value="Fulano">
                    </form>
                </td>
            </tr>
            <tr>
                <td colspan="2" bgcolor="#BFB1A8">
                    <form>
                        <p>Senha:</p>
                        <input name="pass" type="password" value="Senha">
                    </form>
                </td>
            </tr>
            <tr>
                <td colspan="2" bgcolor="#BFB1A8">
                    <table>
                        <td>
                            <form align="center">
                                <button type="submit"><img src="imagens/imagens_www/home.gif"
                                        align="left">Entrar</button>
                            </form>
                        </td>
                        <td>
                            <form align="center">
                                <button type="reset"><img src="imagens/imagens_www/home.gif"
                                        align="left">Limpar</button>
                            </form>
                        </td>
                    </table>
                </td>
            </tr>
        </table>
    </font>
</body>

</html>
